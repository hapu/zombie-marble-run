<html lang="en">
<head>

<title>Zombie Marble Run</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0b1120;--fg:#eaf0ff;--card:rgba(24,33,58,.9);--line:#2b3a62;--track:#0a1020;--lane:#18223f;--wall:#6a7fb0;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.3 ui-rounded,"Nunito",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}

h1{font-size:16px;margin:0 auto 0 0;font-weight:800}
input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;width:92px}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
button.go{background:linear-gradient(135deg,#ffa23c,#ff5a1a);color:#fff;border-color:#ff7a1a;font-weight:800;box-shadow:0 2px 10px rgba(255,90,26,.45)}
button:disabled{opacity:.5}
#wrap{position:relative;flex:1;min-height:0;margin:0 12px 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#0a0e27}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:96%;pointer-events:none}
.pill{cursor:pointer;pointer-events:auto;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--c);border-radius:9px;padding:1px 6px;text-align:center;min-width:30px;line-height:1.05}
.pill b{font-size:13px;display:block}.pill small{font-size:9px;opacity:.7}
#time{position:absolute;left:10px;bottom:8px;background:var(--card);border-radius:10px;padding:3px 10px;font-weight:800;font-variant-numeric:tabular-nums}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 26px;text-align:center;font-size:20px;font-weight:800;display:none}
#banner.big{font-size:64px;background:none;border:0}
.pill.me{outline:2px solid #fff;outline-offset:1px}
#banner.res{text-align:left;font-size:13px;font-weight:600;width:min(92%,430px);max-height:78%;overflow:auto;padding:12px 14px}
#banner.res h2{margin:0 0 6px;font-size:18px}
#banner .row{display:flex;align-items:center;gap:6px;padding:2px 0;border-top:1px solid var(--line)}
#banner .row i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.4)}
#banner .row span{margin-left:auto;opacity:.75;font-weight:500;text-align:right}
#banner .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#preview{position:absolute;inset:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:none;overflow:auto;font-size:11px;font-weight:600}
#preview .g{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}
#preview .c{border-radius:6px;padding:4px;min-height:46px;background:rgba(120,130,160,.25);line-height:1.15}
#preview .c.S,#preview .c.F{background:rgba(80,200,120,.3)}#preview .c.D1,#preview .c.D2,#preview .c.U1,#preview .c.U2{background:rgba(255,190,60,.25)}
#toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;display:none}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--card);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap;display:none}
#dbg{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#9ef;font:11px/1.45 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:8px;display:none;pointer-events:auto}
#dbg button{font-size:10px;padding:2px 7px;margin:3px 3px 0 0;color:#fff;background:#333;border:1px solid #666}
#cap{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:var(--card);border:2px solid #6fa84a;border-radius:999px;padding:5px 14px;font-weight:800;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#menu{display:none;gap:6px;padding:0 12px 8px;flex-wrap:wrap;align-items:center}#menu.on{display:flex}
#helpbox{position:absolute;inset:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:none;overflow:auto;font-size:13px;line-height:1.4;z-index:5}
#helpbox h3{margin:10px 0 3px;font-size:14px}#helpbox p{margin:2px 0}
@media (max-width:480px){h1{display:none}header{padding:8px 10px}}
.pill{box-shadow:0 2px 6px rgba(0,0,0,.3);background:linear-gradient(180deg,var(--card),rgba(20,24,40,.82))}

#time{box-shadow:0 2px 6px rgba(0,0,0,.3)}

body{font-family:Fredoka,ui-rounded,"Nunito",system-ui,sans-serif;background:#e8dcc2 repeating-linear-gradient(45deg,rgba(120,80,40,.04) 0 2px,transparent 2px 7px)}
button,select,input{background:#fff8e8;color:#3f2e1a;border:2px solid #c4a066;border-radius:10px;box-shadow:2px 3px 0 rgba(90,60,30,.3);font-family:inherit}

#preview .c{background:rgba(196,160,102,.25)}

.pc{background:#fff8e8;border:2px dashed #c4a066;border-radius:16px;padding:12px 14px;width:min(94%,380px);max-height:96%;overflow:auto;box-shadow:3px 5px 0 rgba(90,60,30,.3)}
.pc h2{margin:0 0 8px;font-size:18px;text-align:center}

button.big{width:100%;font-size:17px;padding:10px}
#toast{z-index:9}
#hud{top:8px;left:12px;right:12px;transform:none;width:auto;display:block;height:24px;pointer-events:none}
